spring.application.name=consultores-backend

# --- Base de datos principal: Postgres/Neon (auditoria) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5435/ConsultoresDB}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- JWT ---
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-por-una-larga-y-aleatoria-32b}
app.jwt.expiration-ms=86400000

server.port=${PORT:8080}

# --- Oracle Autonomous (monitor real, conexion secundaria) ---
# El wallet viaja como base64 en ORACLE_WALLET_B64 (variable en Render).
# Si no esta definida, el monitor Oracle queda inactivo y el resto sigue igual.
oracle.wallet.b64=${ORACLE_WALLET_B64:}
oracle.username=${ORACLE_USERNAME:ADMIN}
oracle.password=${ORACLE_PASSWORD:}
oracle.tns=${ORACLE_TNS:monitordb_tp}

# Como se identifica esta instancia en el tablero
oracle.instancia.id=${ORACLE_INSTANCIA_ID:autonomous-monitordb}
oracle.instancia.nombre=${ORACLE_INSTANCIA_NOMBRE:monitordb}
oracle.instancia.empresa=${ORACLE_INSTANCIA_EMPRESA:Instancia Autonomous (Oracle Cloud)}

# --- Agentes (instancias Oracle en redes privadas) ---
# Clave compartida que deben enviar en la cabecera X-Agente-Clave.
# Si queda vacia, el endpoint de push responde 503 y nadie puede reportar.
agente.clave=${AGENTE_CLAVE:}
# Segundos sin reportar tras los cuales la instancia se marca sin contacto.
agente.timeout-segundos=${AGENTE_TIMEOUT:180}