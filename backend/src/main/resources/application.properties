spring.application.name=consultores-backend

# --- Base de datos (ajustar usuario/clave segun tu contenedor Docker) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5435/ConsultoresDB}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# --- JPA / Hibernate ---
# 'validate' asume que ya corriste el script SQL. Usa 'update' si preferis
# que Hibernate cree/actualice las tablas automaticamente durante el desarrollo.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- JWT ---
# El secreto debe tener al menos 32 caracteres (256 bits) para HS256.
app.jwt.secret=cambia-esta-clave-secreta-por-una-larga-y-aleatoria-32b
app.jwt.expiration-ms=86400000
#logging.level.org.springframework.security=DEBUG
server.port=${PORT:8080}
