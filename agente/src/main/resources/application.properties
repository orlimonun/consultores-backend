# ============================================================================
#  AGENTE DE MONITOREO — Oracle local
#  Se ejecuta en la MISMA maquina que la base, o en su misma red.
# ============================================================================

spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.cr.una.consultores.agente=INFO

# ---- Identidad de esta instancia en el tablero ----
agente.instancia-id=local-xe-01
agente.nombre=Oracle XE local
agente.empresa=Instancia tradicional (on-premise)

# Esquema del proyecto, para medir la distribucion en tablespaces y las
# claves foraneas sin indice. Si no existe, esas metricas se omiten.
agente.esquema=EIF402

# Cada cuanto reporta, en milisegundos. 60000 = un minuto.
# El backend marca sin contacto a los 180 s, asi que no conviene pasar de ahi.
agente.intervalo-ms=60000

# ---- A donde reportar ----
agente.backend-url=${BACKEND_URL:https://consultores-backend.onrender.com/api/monitoreo/agente/push}
agente.clave=${AGENTE_CLAVE:}

# ---- Conexiones al Oracle local ----
# Dos, a proposito: las bitacoras y el modo de archivado viven en el CDB;
# los tablespaces y los indices del esquema viven en el PDB.
oracle.cdb.url=jdbc:oracle:thin:@//localhost:1521/XE
oracle.pdb.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
# El '#' dentro de un valor NO abre comentario: solo lo hace al inicio de linea.
oracle.user=c##monitor
oracle.password=${ORACLE_MONITOR_PASSWORD:}
